galaxy_info:
  role_name: git
  namespace: rehanone
  author: Rehan Mahmood
  description: The `ansible-git` installs & manages git version control system.

  license: Apache-2.0

  min_ansible_version: '2.15'

  platforms:
    - name: EL
      versions:
        - '8'
        - '9'
        - '10'
    - name: Fedora
      versions:
        - '43'
        - '44'
        - '45'
    - name: opensuse
      versions:
        - '16.0'
        - '16.1'
    - name: Ubuntu
      versions:
        - jammy
        - noble
        - resolute
        - stonking
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: FreeBSD
      versions:
        - '14.4'
        - '14.5'
        - '15.1'
  galaxy_tags:
    - git
    - vcs
dependencies: []
