# code: language=ansible
---
# Main tasks file for role
- name: Setting OS variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - default.yml
      paths:
        - vars/distribution

- name: Set git_users_with_defaults
  ansible.builtin.set_fact:
    git_users_with_defaults: >-
      {{
          git_users_with_defaults | default([]) |
          union( [git_user_defaults | ansible.builtin.combine(user, recursive=true)] )
      }}
  loop: '{{ git.users | default([]) }}'
  loop_control:
    loop_var: user
    label: '{{ user.name }}'

- name: Set git_with_default_users
  ansible.builtin.set_fact:
    git_with_default_users:
      users: '{{ git_users_with_defaults | default([]) }}'

- name: Set git_config
  ansible.builtin.set_fact:
    git_config: >-
      {{ git_defaults |
        ansible.builtin.combine( (git | default(git_defaults)), recursive=true ) |
        ansible.builtin.combine( git_with_default_users, recursive=true )
      }}

- name: Print git_config dictionary if debug flag is set
  ansible.builtin.debug:
    var: git_config
  when: git_config.debug

- name: Install deb822 repository support packages
  become: true
  ansible.builtin.apt:
    name:
      - python3-debian
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - git_config.upstream.manage
    - git_config.upstream.repository is match('^ppa:')
    - ansible_facts.os_family == 'Debian'

- name: Set upstream PPA details
  ansible.builtin.set_fact:
    git_upstream_ppa_owner: >-
      {{ (git_config.upstream.repository | regex_replace('^ppa:', '')).split('/')[0] }}
    git_upstream_ppa_name: >-
      {{ (git_config.upstream.repository | regex_replace('^ppa:', '')).split('/')[1] | default('ppa') }}
  when:
    - git_config.upstream.manage
    - git_config.upstream.repository is match('^ppa:')
    - ansible_facts.os_family == 'Debian'

- name: Look up upstream PPA signing key
  ansible.builtin.uri:
    url: >-
      https://api.launchpad.net/1.0/~{{ git_upstream_ppa_owner }}/+archive/{{ git_upstream_ppa_name }}
    headers:
      Accept: application/json
  register: git_upstream_ppa_info
  when:
    - git_config.upstream.manage
    - git_config.upstream.repository is match('^ppa:')
    - ansible_facts.os_family == 'Debian'

- name: Manage git stable repository from PPA
  become: true
  ansible.builtin.deb822_repository:
    name: "{{ git_upstream_ppa_owner }}-{{ git_upstream_ppa_name }}"
    types:
      - deb
    uris:
      - >-
        https://ppa.launchpadcontent.net/{{ git_upstream_ppa_owner }}/{{ git_upstream_ppa_name }}/ubuntu
    suites:
      - "{{ ansible_facts.distribution_release }}"
    components:
      - main
    signed_by: >-
      https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{
      git_upstream_ppa_info.json.signing_key_fingerprint }}
    state: "{{ git_config.upstream.state }}"
  register: git_upstream_repo_result
  when:
    - git_config.upstream.manage
    - git_config.upstream.repository is match('^ppa:')
    - ansible_facts.os_family == 'Debian'

- name: Update apt cache after upstream repository changes
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  changed_when: false
  when:
    - git_config.upstream.manage
    - git_config.upstream.repository is match('^ppa:')
    - ansible_facts.os_family == 'Debian'
    - git_upstream_repo_result is changed

# Setup package
- name: 'Setup | package {{ git_config.package.name }}'
  become: true
  ansible.builtin.package:
    name: '{{ git_config.package.name }}'
    state: '{{ git_config.package.state }}'
  when: git_config.package.manage

- name: Create git config file for users
  become: true
  ansible.builtin.template:
    src: gitconfig.j2
    dest: '~{{ user.name }}/.gitconfig'
    owner: '{{ user.name }}'
    group: '{{ user.name }}'
    mode: '0644'
  vars:
    fullname: '{{ user.fullname }}'
    email: '{{ user.email }}'
    config: '{{ user.gitconfig }}'
  when: user.state == 'present' and user.manage
  loop: "{{ git_config.users | flatten(levels=1) }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"

- name: Remove git config file for users
  become: true
  ansible.builtin.file:
    path: '~{{ user.name }}/.gitconfig'
    state: absent
  when: user.state == 'absent' and user.manage
  loop: "{{ git_config.users | flatten(levels=1) }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
