# code: language=ansible
---
- name: Side effect
  hosts: all
  gather_facts: true
  tasks:
    - name: Remove git and the upstream repository
      ansible.builtin.include_role:
        name: rehanone.git
      vars:
        git:
          upstream:
            manage: true
            repository: 'ppa:git-core/ppa'
            state: absent
          package:
            manage: true
            state: absent
