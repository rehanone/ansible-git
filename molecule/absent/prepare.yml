# code: language=ansible
---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install python3
      ansible.builtin.raw: >-
        apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt sudo
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:
